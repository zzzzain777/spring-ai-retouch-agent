# 这个文件会提交到公开仓库：只写配置入口，不写真实密钥。
# 真实密钥放同目录下的 application-local.yml（已被 .gitignore 忽略），
# 或者用环境变量 DEEPSEEK_API_KEY / DASHSCOPE_API_KEY。
spring:
  application:
    name: retouch-agent-server
  config:
    # 有本地密钥文件就加载，没有也能启动
    import:
      - optional:classpath:application-local.yml
      - optional:file:./application-local.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:7311/retouch}
    username: ${DATABASE_USER:retouch}
    password: ${DATABASE_PASSWORD:retouch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    # 与上游契约一致：字段名用下划线（image_format、created_at…）
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # 比业务上限 20 MB 略大，让超限请求走到业务校验并返回 413 与中文提示
      max-file-size: 21MB
      max-request-size: 22MB
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:7312/0}
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        table-name: vector_store
    # 规划模型：OpenAI 兼容接口。默认 DeepSeek；改用 DashScope 通义千问时见 application-local.yml.example
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-chat
        temperature: 0

retouch:
  auth:
    # 本地开发默认值；部署时必须用环境变量覆盖
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-at-least-32-bytes}
    ttl: 24h
    secure-cookie: ${COOKIE_SECURE:false}
  storage:
    endpoint: ${S3_ENDPOINT:http://127.0.0.1:7313}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:retouch}
    access-key: ${S3_ACCESS_KEY:retouch}
    secret-key: ${S3_SECRET_KEY:retouch-secret}
    # 签名 URL 有效期
    url-ttl: 15m
  # 图像模型（换背景、扩图、局部消除等）走 DashScope 原生图像接口，由图像服务调用
  image:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com
      text-to-image-model: qwen-image-3.0-pro
      image-edit-model: qwen-image-edit-max
  # 规范检索与合规校验：嵌入模型走 OpenAI 兼容接口，服务商、地址与模型名都从环境变量来
  knowledge:
    embedding:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:}
      model: ${EMBEDDING_MODEL:}
    # 规范问答检索：元数据过滤后取相似度 Top-K，低于阈值不返回
    top-k: 3
    similarity-threshold: 0.5
    # 合规检查：阈值比问答低、条数更多，宁可多召回几条再逐条判规则
    compliance:
      top-k: 5
      similarity-threshold: 0.3
      # 规则表：把规范条款里的关键词映射成「计划必须包含 / 禁止包含」的工具，新增检查项不改代码
      rules:
        - id: background-white
          message: 背景必须纯白
          keywords:
            - 纯白
            - 白底
            - 白色背景
          require-any:
            - remove_background
            - replace_background
        - id: no-text
          message: 主图不得出现文字/促销元素
          keywords:
            - 促销
            - 水印
            - 文字
          forbid:
            - set_layer_text
        - id: square-size
          message: 首图需裁剪或补边到规定比例
          keywords:
            - 正方形
            - 比例
          require-any:
            - crop_canvas
            - prepare_delivery_sizes
            - expand_canvas

  # Python 图像服务：只在内网监听，Java 是唯一调用方
  image-service:
    base-url: ${IMAGE_SERVICE_URL:http://127.0.0.1:7303}
    token: ${IMAGE_SERVICE_TOKEN:dev-internal-token}
  # 任务队列 Worker（队列就是 tool_runs 表）
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: 2
    poll-interval: 500ms
    recover-interval: 30s
  agent:
    # 兜底对账：超过 30 秒没更新的执行中轮次，按 tool_runs 重新推进（Worker 回调丢失或进程重启时）
    reconcile-interval: 30s
  planner:
    # 拿到工具调用后最多追问几轮补全剩余步骤（回给模型“已记录、未执行”，工具不会执行）；0 表示只问一轮
    follow-up-rounds: ${RETOUCH_PLANNER_FOLLOW_UP_ROUNDS:0}

server:
  # 与上游对外端口一致，前端代理与评测集不用改
  port: 7302

management:
  endpoints:
    web:
      exposure:
        include: health,info
